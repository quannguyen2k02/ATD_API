networks:
    app-networks:
        driver: bridge

volumes:
    mysql-data:
        driver: local

services:
    mysql:
        image: mysql:8.0
        container_name: mysql-db
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: root123
            MYSQL_DATABASE: ATD_DB
            MYSQL_USER: atd_user
            MYSQL_PASSWORD: atd_pass
        ports:
            - "3307:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            timeout: 20s
            retries: 10
        networks:
            - app-networks
    atd-api:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: atd-api
        restart: always
        ports:
            - "8080:8080"
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
            - ASPNETCORE_HTTP_PORTS=8080
            - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=ATD_DB;Uid=atd_user;Pwd=atd_pass;SslMode=none;AllowPublicKeyRetrieval=true;
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - app-networks
